# T2.8 S3 emulation fixture (MinIO) — local dev/test storage backend.
# Usage:
#   docker compose -f docker-compose.minio.yml up -d
#   create bucket: docker exec -it undrepost-minio mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb local/undrepost-media
# .env:
#   S3_BUCKET=undrepost-media
#   S3_ENDPOINT=http://127.0.0.1:9000
#   S3_ACCESS_KEY_ID=minioadmin
#   S3_SECRET_ACCESS_KEY=minioadmin
services:
  minio:
    container_name: undrepost-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  minio-data: {}
